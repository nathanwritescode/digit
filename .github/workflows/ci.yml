name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer commit on a pull request cancels that pull request's older run.
# Each push to main gets a group of its own, so those runs are never queued or cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ringkit:
    name: RingKit build and test
    # The image, and with it the installed Xcodes, moves on GitHub's schedule.
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Packages/RingKit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build runs code from the pull request; do not leave the token where it can read it.
          persist-credentials: false

      - name: Select the newest released Xcode
        uses: ./.github/actions/select-xcode

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # --only-use-versions-from-resolved-file makes a stale Package.resolved (missing, lacking a
      # pin, or out of date against Package.swift) fail the build instead of being resolved
      # silently. It does not check that the revisions match the app's (see the app job).
      - name: Build
        run: swift build --only-use-versions-from-resolved-file

      # Running the suite takes seconds (this step also builds the tests), so a step that runs for
      # many minutes has hung; it is cut off instead of holding the job until the job's timeout.
      # Each test target runs in a process of its own, one after another: this toolchain's plain
      # `swift test` runs every target in one process, where other targets' blocking work
      # starved the transport tests' reply timeouts (#68; see the script).
      - name: Test
        timeout-minutes: 10
        run: |
          swift build --build-tests --only-use-versions-from-resolved-file
          Scripts/test-each-target.sh

      # The transport and sync tests again with a one-thread concurrency pool, which catches code that
      # keeps a thread and starves the tasks and timers that should run beside it. Already built
      # by the step above. LIBDISPATCH_COOPERATIVE_POOL_STRICT is an undocumented libdispatch
      # setting: if a future runner image ignores it, this step silently becomes an ordinary run
      # and stops catching starvation. Each target runs in a process of its own, as above, so
      # what this catches is starvation within one target's code and tests.
      - name: Test transport and sync with a one-thread concurrency pool
        timeout-minutes: 5
        env:
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: "1"
        run: Scripts/test-each-target.sh RingTransportTests RingSyncTests

  app:
    name: App build (iOS simulator)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build runs code from the pull request; do not leave the token where it can read it.
          persist-credentials: false

      - name: Select the newest released Xcode
        uses: ./.github/actions/select-xcode

      - name: Show toolchain
        run: xcodebuild -version

      # The signing team is set in a git-ignored Local.xcconfig. Choosing it in Xcode's
      # Signing & Capabilities pane writes it into the project file instead, as the
      # DEVELOPMENT_TEAM build setting and sometimes as DevelopmentTeam under TargetAttributes.
      # The check is quiet (-q) so that a committed team ID is not also copied into this log.
      - name: Check that no signing team is committed
        run: |
          project=App/Digit.xcodeproj/project.pbxproj
          if [ ! -f "$project" ]; then
            echo "::error::$project not found; update this check if the project moved."
            exit 1
          fi
          if grep -qE "DEVELOPMENT_TEAM|DevelopmentTeam" "$project"; then
            echo "::error::A signing team is set in project.pbxproj. Remove DEVELOPMENT_TEAM and DevelopmentTeam from it and set the team in App/Config/Local.xcconfig."
            exit 1
          fi
          if git ls-files --error-unmatch App/Config/Local.xcconfig >/dev/null 2>&1; then
            echo "::error::App/Config/Local.xcconfig is committed. Remove it from the repository; it holds the signing team."
            exit 1
          fi

      # The app and RingKit each have a lockfile (each is its own root for package resolution).
      # The app build accepts any pin inside Package.swift's requirement, so without this a
      # dependency bumped in one lockfile only would leave the app and `swift test` on different
      # revisions with CI green (#58). Uses jq, which is in /usr/bin on macOS 15 and later.
      - name: Check that the app and RingKit lockfiles pin the same revisions
        run: Scripts/check-lockfiles.sh

      - name: Build for the iOS simulator
        run: |
          xcodebuild -project App/Digit.xcodeproj -scheme Digit \
            -destination 'generic/platform=iOS Simulator' \
            -disableAutomaticPackageResolution CODE_SIGNING_ALLOWED=NO build

      # -disableAutomaticPackageResolution should stop the build rewriting the lockfile; this
      # catches it if it ever does, which would otherwise pass unnoticed on a runner.
      - name: Check that the build left the app's lockfile unchanged
        run: git diff --exit-code -- App/Digit.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
