name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer commit on a pull request cancels that pull request's older run.
# Each push to main gets a group of its own, so those runs are never queued or cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ringkit:
    name: RingKit build and test
    # The image, and with it the installed Xcodes, moves on GitHub's schedule.
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Packages/RingKit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build runs code from the pull request; do not leave the token where it can read it.
          persist-credentials: false

      - name: Select the newest released Xcode
        uses: ./.github/actions/select-xcode

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  app:
    name: App build (iOS simulator)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build runs code from the pull request; do not leave the token where it can read it.
          persist-credentials: false

      - name: Select the newest released Xcode
        uses: ./.github/actions/select-xcode

      - name: Show toolchain
        run: xcodebuild -version

      # The signing team is set in a git-ignored Local.xcconfig. Choosing it in Xcode's
      # Signing & Capabilities pane writes it into the project file instead, as the
      # DEVELOPMENT_TEAM build setting and sometimes as DevelopmentTeam under TargetAttributes.
      # The check is quiet (-q) so that a committed team ID is not also copied into this log.
      - name: Check that no signing team is committed
        run: |
          project=App/Digit.xcodeproj/project.pbxproj
          if [ ! -f "$project" ]; then
            echo "::error::$project not found; update this check if the project moved."
            exit 1
          fi
          if grep -qE "DEVELOPMENT_TEAM|DevelopmentTeam" "$project"; then
            echo "::error::A signing team is set in project.pbxproj. Remove DEVELOPMENT_TEAM and DevelopmentTeam from it and set the team in App/Config/Local.xcconfig."
            exit 1
          fi
          if git ls-files --error-unmatch App/Config/Local.xcconfig >/dev/null 2>&1; then
            echo "::error::App/Config/Local.xcconfig is committed. Remove it from the repository; it holds the signing team."
            exit 1
          fi

      - name: Build for the iOS simulator
        run: |
          xcodebuild -project App/Digit.xcodeproj -scheme Digit \
            -destination 'generic/platform=iOS Simulator' \
            -disableAutomaticPackageResolution CODE_SIGNING_ALLOWED=NO build
