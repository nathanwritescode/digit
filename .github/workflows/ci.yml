name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an older run when a newer commit is pushed to the same pull request.
# Runs on main are never cancelled, so every merged commit keeps its result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ringkit:
    name: RingKit build and test
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Packages/RingKit
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          echo "Xcode installations on this runner:"
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          echo "Selecting $XCODE"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
