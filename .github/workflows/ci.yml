name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer commit on a pull request cancels that pull request's older run.
# Each push to main gets a group of its own, so those runs are never queued or cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ringkit:
    name: RingKit build and test
    # The image, and with it the installed Xcodes, moves on GitHub's schedule.
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Packages/RingKit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build runs code from the pull request; do not leave the token where it can read it.
          persist-credentials: false

      - name: Select the newest released Xcode
        uses: ./.github/actions/select-xcode

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  app:
    name: App build (iOS simulator)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build runs code from the pull request; do not leave the token where it can read it.
          persist-credentials: false

      - name: Select the newest released Xcode
        uses: ./.github/actions/select-xcode

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build for the iOS simulator
        run: |
          xcodebuild -project App/Digit.xcodeproj -scheme Digit \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
